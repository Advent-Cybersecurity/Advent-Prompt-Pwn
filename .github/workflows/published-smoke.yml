name: Published package smoke test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  published-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Validate version input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python -c "import os,re; version=os.environ['RELEASE_VERSION'];
          assert re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+', version),
          f'invalid release version: {version}'"
      - name: Install published wheel from PyPI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: --index-url https://pypi.org/simple
          "advent-prompt-pwn==${RELEASE_VERSION}"
      - name: Verify import and installed metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python -c "import importlib.metadata as metadata, os;
          import advent_prompt_pwn;
          assert metadata.version('advent-prompt-pwn') == os.environ['RELEASE_VERSION']"
      - run: advent-prompt-pwn doctor
