name: Mutation qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/advent_prompt_pwn/core/redaction.py"
      - "src/advent_prompt_pwn/integrity.py"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  critical-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,mutation]"
      - name: Run targeted mutation tests
        run: |
          mutmut run --max-children 4
          mutmut results --all | tee mutation-results.txt
          if grep -Eq ": (survived|no tests|timeout|suspicious|segfault)$" mutation-results.txt; then
            echo "Mutation qualification found an unresolved result"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-results
          path: mutation-results.txt
          if-no-files-found: warn
          retention-days: 14
