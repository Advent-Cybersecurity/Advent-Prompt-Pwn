name: Mutation qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/advent_prompt_pwn/core/redaction.py"
      - "src/advent_prompt_pwn/integrity.py"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  critical-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,mutation]"
      - name: Run targeted mutation tests
        run: |
          mutmut run --max-children 4
          python .github/scripts/check_mutation_results.py mutants mutation-results.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-results
          path: mutation-results.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: mutation-debug-metadata
          path: mutants/**/*.meta
          if-no-files-found: warn
          retention-days: 7
