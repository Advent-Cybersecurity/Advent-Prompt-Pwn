[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "advent-prompt-pwn"
version = "1.1.0"
description = "A composable Python toolkit for authorized adversarial testing of AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Advent Cybersecurity LLC" },
]
keywords = [
  "ai-security",
  "llm-security",
  "prompt-injection",
  "red-team",
  "jailbreak-testing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "regex>=2026.9.3,<2027",
]

[project.optional-dependencies]
dev = [
  "build==1.6.0",
  "mypy>=1.13",
  "pip-audit>=2.9",
  "pytest>=8.3",
  "pytest-cov>=6",
  "respx>=0.22",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
  "types-regex>=2026.6.28.20260630",
  "twine==7.0.0",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
]

[project.urls]
Homepage = "https://www.adventcybersecurity.com/"
Repository = "https://github.com/Advent-Cybersecurity/Advent-Prompt-Pwn"
Issues = "https://github.com/Advent-Cybersecurity/Advent-Prompt-Pwn/issues"
Documentation = "https://advent-cybersecurity.github.io/Advent-Prompt-Pwn/"

[project.scripts]
advent-prompt-pwn = "advent_prompt_pwn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/advent_prompt_pwn"]

[tool.hatch.build]
exclude = [
  "CODEX_SESSION.md",
  ".venv*",
  "reports",
  "build-archive*",
  "dist",
  "docs/release-artifacts-1.0.0.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["advent_prompt_pwn"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"src/advent_prompt_pwn/core/runner.py" = ["S311"]
"tests/**/*.py" = ["S101", "S105", "S311"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["advent_prompt_pwn"]
warn_unreachable = true
